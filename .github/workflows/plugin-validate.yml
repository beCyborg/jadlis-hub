name: Validate Plugins

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-plugins-community/.github/actions/validate-plugins@426e469f322952061102b286b378c0c9733a0934
        with:
          claude-cli-version: 2.1.252

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: README parity (H2, links; Mermaid skipped — no mmdc in CI)
        run: python3 tools/readme-parity.py --no-mermaid --allow-missing-en
      - name: privacy grep
        run: python3 tools/privacy-grep.py
      - name: external pins carry ref + sha
        run: python3 tools/bump-pin.py --list
