name: Validate Plugins

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/plugin-ci.yml
    with:
      mode: marketplace
      claude-cli-version: "2.1.263"
      forbid-mermaid: false   # hub READMEs still carry mermaid until the 2026-09 README rewrite
    secrets: inherit
