# Reusable CI for every jadlis-* repo. Called as
#   uses: beCyborg/jadlis-hub/.github/workflows/plugin-ci.yml@main
# NEVER rename this repository: GitHub does not redirect reusable-workflow calls.
#
# mode: plugin      — root-as-plugin repo: claude plugin validate --strict, gitleaks,
#                     privacy-grep, README parity (tools come from this repo).
# mode: marketplace — catalog repo: community validate-plugins composite (SHA-pinned)
#                     + bump-pin --check, gitleaks, privacy-grep, parity.
name: plugin-ci

on:
  workflow_call:
    inputs:
      mode:
        description: plugin | marketplace
        type: string
        default: plugin
      claude-cli-version:
        description: "@anthropic-ai/claude-code version to install (plugin mode)"
        type: string
        default: "2.1.263"
      allow-missing-en:
        description: README without README.en.md is a warning, not an error
        type: boolean
        default: true
      forbid-mermaid:
        description: fail when a README contains a mermaid fence (README contract 2026-09 — images only)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  validate-plugin:
    if: inputs.mode == 'plugin'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install claude CLI (self-healing, mirrors community validate-plugins)
        shell: bash
        env:
          CLAUDE_CLI_VERSION: ${{ inputs.claude-cli-version }}
        run: |
          set -euo pipefail
          PKG="@anthropic-ai/claude-code@${CLAUDE_CLI_VERSION}"
          pkg_root() { echo "$(npm root -g 2>/dev/null || true)/@anthropic-ai/claude-code"; }
          clean_state() {
            local root; root="$(pkg_root)"
            [[ "$root" == */node_modules/@anthropic-ai/claude-code ]] && rm -rf "$root" 2>/dev/null || true
            npm cache clean --force >/dev/null 2>&1 || true
          }
          install_attempt() { timeout -k 10 300 npm install -g --include=optional "$PKG"; }
          heal_postinstall() {
            local root; root="$(pkg_root)"
            if [[ -f "$root/install.cjs" ]]; then
              echo "claude binary missing after install; running postinstall"
              timeout -k 10 300 node "$root/install.cjs" || true
            fi
          }
          ok=""
          for attempt in 1 2 3; do
            [[ "$attempt" -gt 1 ]] && clean_state
            install_attempt || echo "npm install attempt ${attempt} failed or timed out"
            if claude --version 2>/dev/null; then ok=1; break; fi
            heal_postinstall
            if claude --version 2>/dev/null; then ok=1; break; fi
            [[ "$attempt" -lt 3 ]] && sleep $((attempt * 10))
          done
          [[ -n "$ok" ]] || { echo "::error::claude CLI did not become usable after 3 attempts" >&2; exit 1; }
          claude --version
      - name: claude plugin validate --strict
        run: claude plugin validate . --strict
      - name: Legacy marketplace.json (renamed repos keep it for old installs)
        run: |
          if [ -f .claude-plugin/marketplace.json ]; then
            claude plugin validate .claude-plugin/marketplace.json --strict
          fi
      - name: Generated-from-source check (council repos)
        run: |
          if [ -f SHARED_FROM.txt ] && [ -f tools/check-generated.py ]; then
            python3 tools/check-generated.py
          fi

  validate-marketplace:
    if: inputs.mode == 'marketplace'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: anthropics/claude-plugins-community/.github/actions/validate-plugins@426e469f322952061102b286b378c0c9733a0934
        with:
          claude-cli-version: ${{ inputs.claude-cli-version }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: external pins carry ref + sha (hub only)
        if: hashFiles('tools/bump-pin.py') != ''
        run: python3 tools/bump-pin.py --check

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # Full-history scan with the pinned CLI instead of gitleaks-action: the action derives a
      # commit range from the push event and fails with "<root>^" on a repo's first push.
      - name: gitleaks (pinned CLI, full history)
        run: |
          set -euo pipefail
          curl -sSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks && rm gitleaks.tgz
          ./gitleaks git . --no-banner --exit-code 1 --redact
          rm -f gitleaks

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fetch hub tools (readme-parity, privacy-grep)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: beCyborg/jadlis-hub
          ref: main
          path: .hub-tools
          sparse-checkout: tools
          sparse-checkout-cone-mode: false
      - name: Move tools out of the workspace
        run: |
          mkdir -p "$RUNNER_TEMP/hub-tools"
          cp -R .hub-tools/tools/. "$RUNNER_TEMP/hub-tools/"
          rm -rf .hub-tools
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: README parity (H2 sets, links; Mermaid forbidden in README)
        run: |
          if [ "${{ inputs.forbid-mermaid }}" = "true" ] && grep -rl --include='README*.md' '```mermaid' . ; then
            echo "::error::Mermaid fences are not allowed in README (images only)"; exit 1
          fi
          python3 "$RUNNER_TEMP/hub-tools/readme-parity.py" --no-mermaid ${{ inputs.allow-missing-en && '--allow-missing-en' || '' }} .
      - name: privacy grep
        run: python3 "$RUNNER_TEMP/hub-tools/privacy-grep.py" .
